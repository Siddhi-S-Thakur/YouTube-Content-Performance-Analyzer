<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">YouTube Video Analyzer</span>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-5">
                <div class="card shadow-sm p-4">
                    <h4 class="mb-3">Video Details</h4>
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Video Title</label>
                            <input type="text" name="title" class="form-control" placeholder="Enter title..." required>
                        </div>
                        <div class="row">
                            <div class="col">
                                <label class="form-label">Post Day</label>
                                <select name="day" class="form-select">
                                    <option>Monday</option>
                                    <option>Friday</option>
                                    <option>Sunday</option>
                                </select>
                            </div>
                            <div class="col">
                                <label class="form-label">Hour (0-23)</label>
                                <input type="number" name="hour" class="form-control" value="18">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-danger w-100 mt-4">Predict Success</button>
                    </form>
                </div>
            </div>

            <div class="col-md-7">
                {% if prediction %}
                <div class="card shadow-sm p-4 border-danger">
                    <h3>Results for: "{{ prediction.title }}"</h3>
                    <hr>
                    <div class="row text-center mt-3">
                        <div class="col-4">
                            <h5>Views</h5>
                            <p class="display-6 text-primary">{{ prediction.views }}</p>
                        </div>
                        <div class="col-4">
                            <h5>Likes</h5>
                            <p class="display-6 text-success">{{ prediction.likes }}</p>
                        </div>
                        <div class="col-4">
                            <h5>Engagement</h5>
                            <p class="display-6 text-warning">{{ prediction.engagement }}%</p>
                        </div>
                    </div>
                </div>
                {% else %}
                <div class="alert alert-info">Enter a title on the left to see the AI analysis.</div>
                {% endif %}
            </div>
        </div>
    </div>

</body>

</html>
